services:
  db:
    # Postgres 16 with PostGIS (docker/db/Dockerfile)
    build: ./docker/db
    image: potok-postgis:16
    container_name: potok_ide_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: potok_ide_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: