# fly.toml app configuration file generated for potok-ide on 2026-03-17T17:11:35+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'potok-ide'
primary_region = 'fra'
kill_signal = 'SIGTERM'

# Swap on the machine's disk: past its memory the app slows down instead of
# being killed, which would drop every user at once.
swap_size_mb = 512

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'potok.rs'
  PORT = '8080'
  MAILER_FROM_NAME = 'Potok'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Each user holds one websocket. Past hard_limit the proxy stops handing
  # this machine new connections, below the number at which its memory runs
  # out (load_test/README.md).
  [http_service.concurrency]
    type = 'connections'
    hard_limit = 800
    soft_limit = 600

  # Answered by the endpoint before anything else, with no database
  # (PotokIdeWeb.Endpoint): a deploy waits for it, and a machine that stops
  # answering gets no traffic.
  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

# A shared CPU runs at 1/16 of a core per vCPU once its burst balance is
# spent: one vCPU held ~110 active users for good (load test, 2026-11-09),
# four hold about four times that. 512 MB held ~300 active users, and 420
# once pages hibernate and sweep their connections; 1 GB leaves room to spare.
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 4
  memory_mb = 1024
