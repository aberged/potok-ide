name: Android Build And Publish

# Builds the signed Android App Bundle and sends it to Google Play, as
# ios-build-publish.yml does for TestFlight. Every run gets its own
# versionCode (100 + the run number); versionName stays in
# assets/android/app/build.gradle. "What's new" comes from
# assets/android/whatsnew/.

on:
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        # v2 is the closed testing track "druga kap", where the testers are.
        options:
          - internal
          - v2
          - alpha
          - beta
          - production
      status:
        description: Release status (draft waits for a click in Play Console)
        required: true
        default: completed
        type: choice
        options:
          - completed
          - draft
      upload_to_play:
        description: Upload the bundle to Google Play (otherwise only build it)
        required: true
        default: true
        type: boolean

jobs:
  build-and-publish:
    name: Build Android app
    runs-on: ubuntu-latest
    concurrency: android-build-publish
    env:
      ANDROID_PROJECT_PATH: assets/android
      ANDROID_GOOGLE_SERVICES_PATH: assets/android/app/google-services.json
      ANDROID_BUNDLE_PATH: assets/android/app/build/outputs/bundle/release/app-release.aab
      ANDROID_PACKAGE_NAME: rs.potok.ide
      CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate required secrets
        run: |
          required=(
            ANDROID_UPLOAD_KEYSTORE_BASE64
            POTOK_UPLOAD_STORE_PASSWORD
            POTOK_UPLOAD_KEY_ALIAS
            POTOK_UPLOAD_KEY_PASSWORD
            ANDROID_GOOGLE_SERVICES_JSON_BASE64
            CAPACITOR_SERVER_URL
          )

          if [ "${{ inputs.upload_to_play }}" = "true" ]; then
            required+=(PLAY_SERVICE_ACCOUNT_JSON)
          fi

          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          POTOK_UPLOAD_STORE_PASSWORD: ${{ secrets.POTOK_UPLOAD_STORE_PASSWORD }}
          POTOK_UPLOAD_KEY_ALIAS: ${{ secrets.POTOK_UPLOAD_KEY_ALIAS }}
          POTOK_UPLOAD_KEY_PASSWORD: ${{ secrets.POTOK_UPLOAD_KEY_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Install npm dependencies
        working-directory: assets
        run: npm ci

      - name: Write google-services.json
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$ANDROID_GOOGLE_SERVICES_PATH"

      - name: Sync Capacitor Android project
        working-directory: assets
        run: npm run cap:sync:android

      - name: Write upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/potok-upload.jks"

      # build.gradle reads the signing values from the environment.
      - name: Build signed app bundle
        working-directory: ${{ env.ANDROID_PROJECT_PATH }}
        env:
          POTOK_UPLOAD_STORE_PASSWORD: ${{ secrets.POTOK_UPLOAD_STORE_PASSWORD }}
          POTOK_UPLOAD_KEY_ALIAS: ${{ secrets.POTOK_UPLOAD_KEY_ALIAS }}
          POTOK_UPLOAD_KEY_PASSWORD: ${{ secrets.POTOK_UPLOAD_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME=$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' app/build.gradle)

          chmod +x gradlew
          POTOK_UPLOAD_STORE_FILE="$RUNNER_TEMP/potok-upload.jks" \
            ./gradlew bundleRelease --no-daemon "-PpotokVersionCode=$VERSION_CODE"

          {
            echo "### Potok ${VERSION_NAME} (${VERSION_CODE})"
            echo
            echo "* track: \`${{ inputs.track }}\`, status: \`${{ inputs.status }}\`, upload: ${{ inputs.upload_to_play }}"
            echo "* commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ${{ env.ANDROID_BUNDLE_PATH }}
          if-no-files-found: error

      - name: Upload app bundle to Google Play
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: ${{ env.ANDROID_BUNDLE_PATH }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: assets/android/whatsnew

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/potok-upload.jks" "$ANDROID_GOOGLE_SERVICES_PATH"
