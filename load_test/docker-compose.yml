# Stress test stack: Postgres, the production release (built from the repo
# Dockerfile) and the load generator. Driven by run.sh; see README.md.
name: potok_load

x-app-env: &app-env
  DATABASE_URL: ecto://postgres:postgres@db/${DB_NAME:-potok_load_1k}
  # Local-only value; production uses its own secret.
  SECRET_KEY_BASE: k9kt77mW0zmtN3no1Qhi2JfDkkEhrGjT9eJiy7/LRkbtSXUdcj61lbCyEu2B1EVv
  PHX_HOST: localhost
  PORT: "8080"
  POOL_SIZE: ${POOL_SIZE:-10}
  MAILER_FROM_EMAIL: load@potok.test
  MAILGUN_API_KEY: load-test
  MAILGUN_DOMAIN: potok.test
  # The nodes find each other like on Fly: every node's address behind one name.
  DNS_CLUSTER_QUERY: appcluster
  # VM flags for this run (run.sh): the Fly profiles start one scheduler, as a
  # Fly VM sees one CPU while this container sees all of the host's.
  # rel/env.sh.eex only sets ERL_AFLAGS on Fly, so it is free here.
  ERL_AFLAGS: ${APP_ERL_AFLAGS:-}
  # Read only by a test variant built from a scratch worktree (A/B of
  # LiveView's hibernate_after); the app itself ignores it.
  LV_HIBERNATE_AFTER: ${LV_HIBERNATE_AFTER:-}

x-app: &app
  image: potok_load_app
  depends_on:
    db:
      condition: service_healthy
  # Fly machine size by default (fly.toml: 1 CPU, 512 MB); run.sh overrides it.
  deploy:
    resources:
      limits:
        cpus: "${APP_CPUS:-1}"
        memory: ${APP_MEM:-512M}
  # No swap, like a Fly machine: hitting the limit means an OOM kill.
  memswap_limit: ${APP_MEM:-512M}
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  volumes:
    - ./:/load_test
  restart: "no"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    volumes:
      - ./db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["sh", "-c", "/app/bin/migrate && exec /app/bin/server"]
    environment:
      <<: *app-env
      # rel/env.sh.eex uses long node names, and DNSCluster dials <name>@<ip>.
      RELEASE_NODE: potok_ide@172.30.0.11
    networks:
      default:
        ipv4_address: 172.30.0.11
        aliases: [appcluster]
    ports:
      - "127.0.0.1:4020:8080"

  # The second node of `--profile cluster`; run.sh starts it once `app` has
  # migrated the database.
  app2:
    <<: *app
    profiles: ["cluster"]
    command: ["/app/bin/server"]
    environment:
      <<: *app-env
      RELEASE_NODE: potok_ide@172.30.0.12
    networks:
      default:
        ipv4_address: 172.30.0.12
        aliases: [appcluster]
    ports:
      - "127.0.0.1:4021:8080"

  loadgen:
    image: hexpm/elixir:1.18.2-erlang-27.3.4-debian-trixie-20260223-slim
    profiles: ["loadgen"]
    working_dir: /load_test
    entrypoint:
      - sh
      - -c
      - mix local.hex --force --if-missing >/dev/null && exec elixir --erl "+P 4000000 +Q 1000000" /load_test/loadgen.exs "$$@"
      - loadgen
    environment:
      LANG: C.UTF-8
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2560M
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    volumes:
      - ./:/load_test
      - mixhome:/root/.mix
      - hexhome:/root/.hex
      - mixcache:/root/.cache

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  mixhome:
  hexhome:
  mixcache:
