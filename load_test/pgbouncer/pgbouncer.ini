; PgBouncer as Fly Managed Postgres runs it once switched to transaction mode
; (profile `pooler`, see README.md): a server connection serves one
; transaction, and named prepared statements are not carried over, so the
; app must use unnamed ones (`prepare: :unnamed`).
[databases]
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
max_prepared_statements = 0
max_client_conn = 200
; MPG Basic allows 50 database connections.
default_pool_size = 40
server_reset_query =
ignore_startup_parameters = extra_float_digits
